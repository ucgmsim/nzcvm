name: Benchmarks

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  criterion:
    name: Criterion Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write # plots are pushed to the criterion-plots branch
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ucgmsim/meta-ci-action/criterion-bench@v2

  dask:
    name: Dask Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # This job manages its own cache below.
          cache: false
          # The action defaults RUSTFLAGS to "-D warnings"; clippy gates
          # warnings in CI, so keep the benchmark build as it was.
          rustflags: ""

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Dask generate benchmark
        env:
          # Benchmark the optimised extension, not a debug build.
          SETUPTOOLS_RUST_CARGO_PROFILE: release
        run: |
          uv run --dev python benchmarks/benchmark_generate.py \
            >> $GITHUB_STEP_SUMMARY
