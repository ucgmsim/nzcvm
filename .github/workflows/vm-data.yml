---
name: Publish VM data
run-name: >-
  Publish models and site database for
  ${{ github.event.release.tag_name || github.ref_name }}

# Builds every basin and tomography model from ucgmsim/nzcvm_data, tests
# them, builds the site database from them, and publishes both as GitHub
# release assets, which anyone can download without credentials:
#
#   models-vX.Y.Z.zip     Built once per release, attached to that release
#   sites-vX.Y.Z.zip      and linked from its description with their SHA-256.
#   models-master.zip     Rebuilt on every push to master, and replaced on
#   sites-master.zip      the one rolling `vm-data-tip` prerelease.
#   models-<branch>.zip   Built when the workflow is dispatched on another
#   sites-<branch>.zip    branch, and replaced on the same prerelease.
#
# Each zip has a `.sha256` sidecar. The prerelease holds the newest build of
# each branch and nothing older. Its files don't expire, and a branch's files
# are named for it, so it can't overwrite master's or a release's.
#
# The inputs still come from a public Dropbox folder, where they are uploaded
# by hand:
#
#   resources.zip         Vs30, DEM and coastline. Fixed.
#   stations.csv          Station list. The site database covers its
#                         observational stations.
#
# Needs a RCLONE_CONFIG secret holding an rclone config with a `dropbox`
# remote that can read from and share from the folder below. Nothing is
# written to Dropbox.

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

# A newer master push supersedes the running master build. Releases each get
# their own group and are never cancelled.
concurrency:
  group: >-
    vm-data-${{ github.event_name == 'release'
    && github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  # Attaching assets to releases, creating and editing the rolling one, and
  # moving its tag.
  contents: write

env:
  DROPBOX_DIR: "dropbox:/QuakeCoRE/Public/VM Data"
  # The rolling prerelease that holds each branch's newest build. The tag has
  # no digits, so it can't be read as a version: setuptools-scm only looks at
  # tags matching `*[0-9]*`, and its tag regex needs a digit after any prefix.
  # Never rename it to something version-like (`tip-2026`, `v2-latest`). The
  # job conditions here and in publish-PyPI.yml repeat the name, since `env`
  # can't be read there.
  ROLLING_TAG: vm-data-tip
  DATA_REPO: https://github.com/ucgmsim/nzcvm_data.git
  NZCVM_DATA_ROOT: ${{ github.workspace }}/nzcvm_data
  # Only the LFS files the Justfile recipes read: the basin surfaces, and the
  # DEMs they were modelled against (CantDEM sits under regional/). Pulling
  # the whole LFS store spends the org's LFS bandwidth on data nothing here
  # uses. A JSON list, since the cache key can't contain the commas that
  # `git lfs pull --include` takes.
  LFS_INCLUDE: '["regional/**", "surface/NZ_DEM_HD.h5"]'

jobs:
  publish:
    # The rolling prerelease is created by this workflow. Events caused by
    # the workflow's own GITHUB_TOKEN don't start other workflows, so this
    # would not loop, but a token swapped for a PAT someday would.
    if: >-
      github.event_name != 'release'
      || github.event.release.tag_name != 'vm-data-tip'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout nzcvm
        uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the tags.
          fetch-depth: 0

      - name: Resolve nzcvm_data revision
        id: data
        run: |
          sha=$(git ls-remote "$DATA_REPO" HEAD | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache nzcvm_data
        id: data-cache
        uses: actions/cache@v4
        with:
          path: nzcvm_data
          key: >-
            nzcvm-data-${{ steps.data.outputs.sha }}-${{
            join(fromJSON(env.LFS_INCLUDE), '+') }}

      - name: Clone nzcvm_data
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone "$DATA_REPO" nzcvm_data
          git -C nzcvm_data checkout "${{ steps.data.outputs.sha }}"
          git -C nzcvm_data lfs pull \
            --include "${{ join(fromJSON(env.LFS_INCLUDE), ',') }}"
          rm -rf nzcvm_data/.git

      - name: Set up rclone
        # It gets the Dropbox credentials, so it's pinned to a commit.
        # v1
        uses: AnimMouse/setup-rclone@26ef2133e09fd383329a1d4c1fbe6a71db1976c9
        with:
          # The secret holds the rclone config base64-encoded
          # (`base64 -w0 rclone.conf`), with a `dropbox` remote.
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Download resources and stations
        run: |
          rclone copy "$DROPBOX_DIR/resources.zip" .
          rclone copy "$DROPBOX_DIR/stations.csv" .
          unzip -q resources.zip

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Build and test models
        # Also zips models/ into models.zip.
        run: just models

      - name: Build site database
        # Also zips sites/ into sites.zip.
        run: just sites --n-threads "$(nproc)"

      - name: Checksum and describe the outputs
        id: pkg
        env:
          TAG: ${{ github.event.release.tag_name }}
          DATA_SHA: ${{ steps.data.outputs.sha }}
          MODELS_ABOUT: Basin and tomography models
          SITES_ABOUT: >-
            Site database: profiles, and Vs30, Z1.0 and Z2.5 per station
          RESOURCES_ABOUT: Vs30, DEM and coastline that the models build from
        run: |
          # A release's files go on that release. Any branch's go on the
          # rolling prerelease under the branch's name, so a dispatch from
          # another branch can't overwrite master's files or a release's.
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            mode=release; release_tag="$TAG"; suffix="v${TAG#v}"
          else
            mode=rolling; release_tag="$ROLLING_TAG"
            suffix="${GITHUB_REF_NAME//\//-}"
          fi
          {
            echo "mode=$mode"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download"

          # The backticks are Markdown, not command substitution.
          # shellcheck disable=SC2016
          row() { printf '| [%s](%s) | %s | `%s` |\n' "$@"; }
          rows=()
          mkdir -p publish
          for kind in models sites; do
            name="$kind-$suffix.zip"
            sha=$(sha256sum "$kind.zip" | cut -d' ' -f1)
            mv "$kind.zip" "publish/$name"
            # The checksum sits beside each zip too, since only releases
            # record it in their description.
            echo "$sha  $name" > "publish/$name.sha256"
            about="${kind^^}_ABOUT"
            link="$base/$release_tag/$name"
            rows+=("$(row "$name" "$link" "${!about}" "$sha")")
          done
          # resources.zip is an input, so its link is still Dropbox's.
          link=$(rclone link "$DROPBOX_DIR/resources.zip")
          sha=$(sha256sum resources.zip | cut -d' ' -f1)
          rows+=("$(row resources.zip "$link" "$RESOURCES_ABOUT" "$sha")")
          {
            echo "<!-- vm-data -->"
            echo "## Model data"
            echo
            echo "| File | Contents | SHA-256 |"
            echo "| --- | --- | --- |"
            printf '%s\n' "${rows[@]}"
            echo
            data_url="https://github.com/ucgmsim/nzcvm_data/tree/$DATA_SHA"
            echo "Built from [nzcvm_data@${DATA_SHA:0:7}]($data_url)."
            echo "<!-- /vm-data -->"
          } > downloads.md
          cat downloads.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach to the release
        if: steps.pkg.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.release_tag }}
        run: |
          # --clobber replaces an asset of the same name, so a re-run of the
          # workflow for this release replaces the files rather than failing.
          gh release upload "$TAG" publish/* --clobber
          # Drop any table from an earlier run of this release, so a re-run
          # replaces it rather than adding a second.
          gh release view "$TAG" --json body --jq .body \
            | sed '/<!-- vm-data -->/,/<!-- \/vm-data -->/d' > body.md
          printf '\n' >> body.md
          cat downloads.md >> body.md
          gh release edit "$TAG" --notes-file body.md

      - name: Update the rolling release
        if: steps.pkg.outputs.mode == 'rolling'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.release_tag }}
        run: |
          # Unlike a release, this one is replaced rather than versioned.
          # Its description describes master's build, so only a master build
          # rewrites it, and rewrites it whole.
          {
            echo "Automated, mutable builds. \`models-master.zip\` and"
            echo "\`sites-master.zip\` are replaced on every push to master,"
            echo "and a branch's files whenever the workflow is dispatched on"
            echo "it, so files here change without notice. Use a versioned"
            echo "release for anything that needs to be reproduced or cited."
          } > body.md
          if [ "$GITHUB_REF" = refs/heads/master ]; then
            {
              echo
              echo "Master's files were built from [nzcvm@${GITHUB_SHA:0:7}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)."
              echo
              cat downloads.md
            } >> body.md
          fi
          title="Model data from the tip of each branch"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # --clobber replaces this branch's earlier files. Assets first,
            # so the release is never left without files.
            gh release upload "$TAG" publish/* --clobber
            if [ "$GITHUB_REF" = refs/heads/master ]; then
              # Then the tag, then the description that names the commit.
              gh api --method PATCH \
                "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
                -f sha="$GITHUB_SHA" -F force=true > /dev/null
              gh release edit "$TAG" --title "$title" --notes-file body.md \
                --prerelease --latest=false
            fi
          else
            # Creates the tag at this commit; the next master build moves it
            # to master. It's a prerelease, and never Latest, so the releases
            # page and `releases/latest` still point at the newest version.
            gh release create "$TAG" publish/* --target "$GITHUB_SHA" \
              --title "$title" --notes-file body.md \
              --prerelease --latest=false
          fi
