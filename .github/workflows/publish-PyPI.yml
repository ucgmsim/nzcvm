name: Publish to PyPI
run-name: Publish Python Package to PyPI for release ${{ github.event.release.tag_name || inputs.tag_name || github.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag to checkout and publish"
        required: false
        type: string

jobs:
  # sdist plus a cibuildwheel matrix (Linux, macOS, Windows) over every CPython
  # that requires-python allows. See ucgmsim/meta-ci-action's README.
  build:
    uses: ucgmsim/meta-ci-action/.github/workflows/build-dist.yml@v2.3
    with:
      ref: ${{ inputs.tag_name }} # empty on a release: builds the release tag
      # Free-threaded (*t-*) builds are skipped: the pymodule does not declare
      # gil_used = false, so a cp31Xt wheel would silently re-enable the GIL.
      cibw-skip: "pp* *-musllinux_* *t-*"

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nzcvm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.13.0
