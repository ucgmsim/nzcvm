name: Publish to PyPI
run-name: Publish Python Package to PyPI for release ${{ github.event.release.tag_name || inputs.tag_name || github.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git tag to checkout and publish'
        required: false
        type: string

jobs:
  build:
    name: Build distribution 📦
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.0
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          # setuptools-scm derives the version from the tag, so it needs the
          # full history rather than a shallow clone.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Rust targets for macOS
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          # The extension is not abi3, so cibuildwheel builds one wheel per
          # interpreter. The set of interpreters comes from
          # `requires-python = ">=3.13"` in pyproject.toml, so a new CPython
          # release is picked up without touching this file.
          #
          # Skipped: musllinux (no consumers), and the free-threaded builds
          # (`*t-*`) because the crate has not been audited for it — the
          # pymodule does not declare `gil_used = false`, so a cp31Xt wheel
          # would silently re-enable the GIL on import.
          CIBW_SKIP: "pp* *-musllinux_* *t-*"
          CIBW_ARCHS_MACOS: "x86_64 arm64"  # Build for Intel and Apple Silicon
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ARCHS_LINUX: "x86_64"
          # This is needed as for linux the wheel build process happens inside a container instead of the Github runner
          # See https://cibuildwheel.pypa.io/en/stable/platforms/#linux-containers
          #
          # safe.directory is set because the checkout is mounted at /project
          # under a different uid, which otherwise makes git — and so
          # setuptools-scm — refuse to read the version out of the repository.
          CIBW_BEFORE_ALL_LINUX: "git config --global --add safe.directory /project && curl https://sh.rustup.rs -sSf | sh -s -- --default-toolchain stable -y && source $HOME/.cargo/env"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          # Required to build wheels with Rust extensions on macOS
          # See https://cibuildwheel.pypa.io/en/stable/platforms/#macos-version-compatibility
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Build source distribution (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m pip install build
          python3 -m build --sdist

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-${{ matrix.os }}
          path: |
            wheelhouse/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/nzcvm

    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        pattern: python-package-distributions-*
        merge-multiple: true
        path: artifacts/

    - name: Collect all distributions into dist/
      run: |
        mkdir -p dist/
        find artifacts/ -name '*.whl' -exec cp {} dist/ \;
        find artifacts/ -name '*.tar.gz' -exec cp {} dist/ \;
        ls -la dist/

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
