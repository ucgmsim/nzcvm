name: CI

on: [pull_request]

jobs:
  ci:
    uses: ucgmsim/meta-ci-action/.github/workflows/ci.yml@main
    with:
      package-dir: nzcvm
      # The crate is built by every Python job; without --profile=dev they each
      # pay for the release profile's lto/codegen-units=1.
      uv-extra-args: "--all-extras --dev -C build-args=--profile=dev"
      # Empty: defer to [tool.pytest.ini_options] testpaths, which covers both
      # tests/ and the doctests in nzcvm/.
      pytest-paths: ""
      rust-features: "high_precision"
