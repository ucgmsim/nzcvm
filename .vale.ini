StylesPath = .vale
Packages = ai-tells, proselint, Google
Vocab = nzcvm

[*.md]
BasedOnStyles = Vale, ai-tells, proselint, Google

# The project writes New Zealand English: serialise, realisable, recognised.
Google.Spelling = NO
# Reference tables carry their qualifiers in parentheses, and the option and
# grid-key tables are made of little else.
Google.Parens = NO
# A topographic surface is a triangulated mesh here, not a figure of speech.
ai-tells.FigurativeNouns = NO

[*.py]
BasedOnStyles = ai-tells, proselint, Google

# ---------------------------------------------------------------------------
# Vale has no reStructuredText or numpydoc parser, and no way to scope a rule
# inside a source file: TokenIgnores, BlockIgnores and `vale off` comments all
# apply to markup formats only. So numpydoc section underlines, `name : type`
# parameter lines, See Also and References entries, doctest blocks and inline
# literals reach these rules as ordinary prose, and switching the rule off for
# Python is the only lever available.
# ---------------------------------------------------------------------------

# Section underlines ("Parameters\n----------") and `# ---` comment banners.
ai-tells.DoubleHyphen = NO
# `name : type` parameter lines and See Also entries ("module.Thing : What").
ai-tells.ColonUsage = NO
# A dotted name reads as a missing space after a period: "'l.M' should have one
# space" for `nzcvm.velocity_model.Model`.
Google.Spacing = NO
# Call signatures, array shapes and doctest expressions read as parentheticals.
Google.Parens = NO
# Domain acronyms (CRS, EPSG, NZCVM, GTL) and literal enum members (ALL, SKIP).
# The rule wants each one spelled out in the file that uses it, which
# per-module reference docs cannot do.
Google.Acronyms = NO
# Doctest continuation lines and elided arguments, `f(..., dask="parallelized")`.
Google.Ellipses = NO
proselint.Typography = NO
# The I and J grid axes read as the first-person pronoun.
Google.FirstPerson = NO
# A References author list matches the verbless-fragment token: "Small, P., &
# Maechling, P. J." in nzcvm/ely_taper.py.
ai-tells.MicDrop = NO
# Punctuation inside commented-out code, `# gmsh.option.setNumber("X", 0)`.
Google.Quotes = NO
# Emphasis around a Python identifier: `_is_pkg` reads as an italicised "is".
ai-tells.EmphaticCopula = NO
# TODO, FIXME and NOTE are code annotations, not prose left unfinished.
proselint.Annotations = NO

# ---------------------------------------------------------------------------
# Domain vocabulary that general-prose rules read as figure of speech. Both
# rules name this exemption in their own guidance.
# ---------------------------------------------------------------------------

# A topographic surface is a triangulated mesh here, not a figure of speech.
ai-tells.FigurativeNouns = NO
# "shape" is the array dimension tuple.
ai-tells.FigurativeShape = NO

# The project writes New Zealand English: serialise, realisable, recognised.
Google.Spelling = NO
