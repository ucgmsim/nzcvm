[build-system]
requires = ["maturin>=1.12,<2.0", "cffi"] # Maturin requires cffi to build with!
build-backend = "maturin"

[project]
name = "nzcvm"
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
  "dask[array,diagnostics,distributed]>=2026.3.0",
  "distributed>=2026.3.0",
  "geopandas>=1.1.3",
  "gmsh>=4.15.2",
  "h5py>=3.16.0",
  "hdf5plugin>=6.0.0",
  "joblib>=1.5.3",
  "mashumaro[toml,yaml]>=3.20",
  "numba>=0.65.0",
  "numcodecs>=0.16.5",
  "numpy>=2.4.4",
  "pandas[parquet]>=2.0",
  "platformdirs>=4.9.6",
  "psutil>=7.2.2",
  "pyproj>=3.7.2",
  "rich>=14.3.3",
  "rioxarray>=0.22.0",
  "scipy>=1.17.1",
  "shapely>=2.1.2",
  "tqdm>=4.67.3",
  "typer>=0.24.2",
  "xarray-dataclasses>=1.10.0",
  "xarray[io]>=2026.2.0",
  "zarr>=3.1.6",
  "zfpy>=1.0.1",
]


[tool.ruff.lint.isort]
known-first-party = ["nzcvm"]

[tool.numpydoc_validation]
# The subset the package currently satisfies. The remaining numpydoc codes are
# a docstring-writing backlog, not a CI change: as of this commit nzcvm/ has
# ~470 outstanding violations of GL08 (missing docstring), PR04 (missing
# parameter type), PR01 (undocumented parameter) and RT01 (no Returns section).
# Add them here as they are worked through.
checks = ["GL05", "GL10", "PR02", "PR07", "RT03", "YD01"]

[tool.deptry.per_rule_ignores]
# Both are used through a plugin registry rather than an import: rioxarray
# registers the xarray `engine="rasterio"` backend used by
# nzcvm/scripts/convert_tiff.py, and zfpy backs the numcodecs ZFPY codec used
# by nzcvm/formats/datatree.py.
DEP002 = ["rioxarray", "zfpy"]

[project.optional-dependencies]
vis = ["pyvista>=0.47.2"]

[project.scripts]
nzcvm = "nzcvm.scripts.nzcvm_cli:app"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "**/*.rs" },
]

[dependency-groups]
dev = [
  "deptry>=0.23.1",
  "hypothesis>=6.0.0",
  "ipython>=9.12.0",
  "numpydoc>=1.10.0",
  "pytest>=8.0.0",
  "pyvista>=0.48.4",
  "ruff>=0.15.10",
  "ty>=0.0.29",
]

[tool.pytest.ini_options]
testpaths = ["tests", "nzcvm"]
addopts = "--strict-markers --doctest-modules"
markers = ["real_data: requires a real model directory supplied via MODEL_PATH"]
