[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "setuptools-rust>=1.11"]
build-backend = "setuptools.build_meta"

[project]
name = "nzcvm"
authors = [{ name = "ucgmsim" }]
description = "New Zealand Community Velocity Model"
readme = "README.md"
requires-python = ">=3.13"
# No PyPy: the extension is built against the CPython API without abi3, so
# every wheel is CPython- and version-specific.
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]
dependencies = [
  "dask[array,diagnostics,distributed]>=2026.3.0",
  "distributed>=2026.3.0",
  "geopandas>=1.1.3",
  "gmsh>=4.15.2",
  "h5py>=3.16.0",
  "hdf5plugin>=6.0.0",
  "joblib>=1.5.3",
  "mashumaro[toml,yaml]>=3.20",
  "numba>=0.65.0",
  "numcodecs>=0.16.5",
  "numpy>=2.4.4",
  "pandas[parquet]>=2.0",
  "platformdirs>=4.9.6",
  "psutil>=7.2.2",
  "pyproj>=3.7.2",
  "rich>=14.3.3",
  "rioxarray>=0.22.0",
  "scipy>=1.17.1",
  "shapely>=2.1.2",
  "tqdm>=4.67.3",
  "typer>=0.24.2",
  "xarray-dataclasses>=1.10.0",
  "xarray[io]>=2026.2.0",
  "zarr>=3.1.6",
  "zfpy>=1.0.1",
]


[tool.ruff.lint.isort]
known-first-party = ["nzcvm"]

[tool.numpydoc_validation]
checks = ["GL05", "GL10", "PR02", "PR07", "RT03", "YD01"]

[tool.deptry.per_rule_ignores]
# Both are used through a plugin registry rather than an import: rioxarray
# registers the xarray `engine="rasterio"` backend used by
# nzcvm/scripts/convert_tiff.py, and zfpy backs the numcodecs ZFPY codec used
# by nzcvm/formats/datatree.py.
DEP002 = ["rioxarray", "zfpy"]

[project.optional-dependencies]
vis = ["pyvista>=0.47.2"]

[project.scripts]
nzcvm = "nzcvm.scripts.nzcvm_cli:app"

# The Rust extension lands at nzcvm/nzcvm.<abi>.so; the Python half is a plain
# package tree alongside it.
[tool.setuptools.packages.find]
include = ["nzcvm*"]

[tool.setuptools_scm]

# `nzcvm.nzcvm` matches `#[pymodule] mod nzcvm` in src/lib.rs. `path` defaults
# to Cargo.toml. Not abi3, so one wheel is produced per Python version.
[[tool.setuptools-rust.ext-modules]]
target = "nzcvm.nzcvm"
binding = "PyO3"
# Release unless SETUPTOOLS_RUST_CARGO_PROFILE overrides it.
debug = false

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "**/*.rs" },
]

[dependency-groups]
dev = [
  "deptry>=0.23.1",
  "hypothesis>=6.0.0",
  "ipython>=9.12.0",
  "numpydoc>=1.10.0",
  "pytest>=8.0.0",
  "pyvista>=0.48.4",
  "ruff>=0.15.10",
  "ty>=0.0.29",
]

[tool.pytest.ini_options]
# The setuptools editable install exposes only the `nzcvm` package, so the repo
# root has to be added explicitly for `tests.conftest` to be importable.
pythonpath = ["."]
testpaths = ["tests", "nzcvm"]
addopts = "--strict-markers --doctest-modules"
markers = ["real_data: requires a real model directory supplied via MODEL_PATH"]
