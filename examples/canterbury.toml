[metadata]
title = "Canterbury fence diagram domain"
keywords = ["canterbury", "figure"]
creator_name = "Jake Faulkner"
creator_email = "jake.faulkner@canterbury.ac.nz"

# A 260 x 200 km box over the Canterbury Plains, from the Main Divide in the
# west to offshore of Banks Peninsula in the east. The README fence diagram
# (docs/images/canterbury_fence.png) is rendered from this config's output by
# scripts/canterbury_fence.py. `just canterbury_fence` runs both steps.
[grid]
type = "regular"
surface = "./resources/dem.zarr"

extent_x = 260000.0
extent_y = 200000.0
thickness = 5000.0

resolution_x = 500.0
resolution_y = 500.0
resolution_z = 100.0

# The origin is the centre of the box. Azimuth 0 runs i west to east and j
# south to north, so each j index is a west-east section.
[grid.orientation]
crs = 'EPSG:2193'
azimuth = 0.0
origin_lon = 172.0
origin_lat = -43.5

[grid.chunks]
i = 128
j = 128

[[layers]]
# Average each 100 m depth cell over five sub-samples.
type = "backus"
samples = 5

[[layers]]
type = "clamp"
min_vp_vs_ratio = 1.73
max_vp_vs_ratio = 4.0

[[layers]]
type = "coastline"
coastline = "resources/coastline.wkb.gz"

[[layers]]
type = "offshore"
