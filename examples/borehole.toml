# Borehole profiles over the synthetic dataset.
#
#     just synthetic
#     uv run nzcvm generate examples/borehole.toml synthetic/boreholes.zarr
#
# A borehole grid extracts one vertical profile per site instead of filling a
# volume, so it has no extent, no azimuth and no model origin: just a
# projection to extract the profiles in.

[metadata]
title = "Synthetic borehole profiles"
keywords = ["synthetic", "borehole", "testing"]

[grid]
type = "borehole"
surface = "./synthetic/dem.zarr"

# Bottom of every column, in metres below the topography, and the sample
# spacing down to it.
depth = 600.0
resolution_z = 25.0

# Sites can also come from a CSV or Parquet file with name, longitude and
# latitude columns. It has to stay above the tables below, as TOML would
# otherwise read it as a key of `[grid.projection]`.
#
# sites = "examples/sites.csv"

[grid.projection]
crs = 'EPSG:2193'

[[grid.sites]]
name = "GULL"          # inside the `gully` basin
longitude = 172.15
latitude = -43.70

[[grid.sites]]
name = "TERR"          # inside the `terrace` basin
longitude = 172.30
latitude = -43.53

[[grid.sites]]
name = "RIDG"          # up in the hills, outside every basin
longitude = 172.10
latitude = -43.45

[[grid.sites]]
name = "SEAB"          # offshore
longitude = 172.55
latitude = -43.60

[[layers]]
type = "clamp"
min_vp_vs_ratio = 1.73
max_vp_vs_ratio = 4.0

[[layers]]
type = "coastline"
coastline = "synthetic/coastline.wkb.gz"

[[layers]]
type = "offshore"
model = [
    {bottom_depth = 50.0, rho = 1810.0, vp = 1800.0, vs = 380.0, qp = 100.0, qs = 50.0, alpha = 1.0},
    {bottom_depth = 300.0, rho = 1810.0, vp = 1800.0, vs = 580.0, qp = 100.0, qs = 50.0, alpha = 1.0},
    {bottom_depth = 1200.0, rho = 1810.0, vp = 1800.0, vs = 830.0, qp = 100.0, qs = 50.0, alpha = 1.0},
]
basin_depth = [
    {distance = 0.0, bottom_depth = 0.0},
    {distance = 10000.0, bottom_depth = 1000.0},
]

[[layers]]
type = "ely"
vs30 = "./synthetic/vs30.zarr"
depth_t = 450.0

[[layers]]
type = "query"
model_path = "./synthetic/models"
model_globs = ["*.zarr"]
