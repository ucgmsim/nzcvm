# Borehole profiles at every station, for the published site database.
#
#     uv run scripts/site_database.py stations.csv examples/site_database.toml sites
#
# The script fills in `sites` and `depth` itself, one batch of stations at a
# time, and deepens the columns that never reach Vs = 2.5 km/s. The values
# here are placeholders that keep the config valid on its own.
#
# The layer stack is examples/whole_country.toml without the clamp layer, so
# the profiles carry the Ely taper unclamped. There is no Backus averaging.

[metadata]
title = "NZCVM site database"
keywords = ["sites", "borehole"]

[grid]
type = "borehole"
surface = "./resources/dem.zarr"
depth = 5000.0
resolution_z = 5.0
sites = "stations.csv"

[grid.projection]
crs = 'EPSG:2193'

[[layers]]
type = "coastline"
coastline = "resources/coastline.wkb.gz"

[[layers]]
# Geotechnical weathering layer.
type = "ely"
vs30 = "./resources/vs30.zarr"
depth_t = 450.0

[[layers]]
type = "offshore"
model = [
