# The borehole grid of the published site database. The layers come from
# examples/whole_country.toml, without its clamp layer, so the profiles carry
# the Ely taper unclamped. There is no Backus averaging.
#
#     uv run scripts/site_database.py examples/site_database.toml \
#         examples/whole_country.toml sites
#
# The script keeps the observational stations from `sites` and starts every
# profile at `depth`. It deepens the profiles that never reach
# Vs = 2.5 km/s.

[metadata]
title = "NZCVM site database"
keywords = ["sites", "borehole"]

[grid]
type = "borehole"
surface = "./resources/dem.zarr"
depth = 5000.0
resolution_z = 5.0
sites = "stations.csv"

[grid.projection]
crs = 'EPSG:2193'
